    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f5; color: #17324d; }
    header { padding: 3rem 1rem; text-align: center; color: white; background: #176b78; }
    h1 { margin: 0 0 .5rem; }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.75rem; padding: 2.5rem; max-width: 1500px; margin: auto; }
    figure { margin: 0; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 10px #0002; }
    .gallery img, .gallery video { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; cursor: zoom-in; border-radius: 10px 10px 0 0; }
    .gallery img:focus, .gallery video:focus { outline: 4px solid #176b78; outline-offset: -4px; }
    figcaption { display: none; }
    .image-dialog { width: min(90vw, 900px); max-width: 900px; padding: 0; border: 0; border-radius: 10px; background: #fff; color: #17324d; box-shadow: 0 12px 50px #0008; }
    .image-dialog::backdrop { background: #071c24cc; }
    .image-dialog-viewer { position: relative; background: #102c35; }
    .image-dialog img, .image-dialog video { width: 100%; max-height: 70vh; object-fit: contain; display: block; }
    .image-dialog img[hidden], .image-dialog video[hidden] { display: none; }
    .image-dialog-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 .75rem; transform: translateY(-50%); pointer-events: none; }
    .image-dialog-arrow { width: 2.75rem; height: 2.75rem; border: 0; border-radius: 50%; background: #ffffffdd; color: #17324d; font-size: 1.75rem; line-height: 1; cursor: pointer; pointer-events: auto; }
    .image-dialog-arrow:hover, .image-dialog-arrow:focus { background: #fff; outline: 3px solid #7ca66a; }
    .image-dialog-content { padding: 1rem 1.25rem 1.25rem; }
    .image-dialog h2 { margin: 0 0 .35rem; font-size: 1.25rem; }
    .image-dialog p { margin: 0 0 1rem; }
    .image-dialog-close { display: block; margin-left: auto; padding: .55rem .9rem; border: 1px solid #17324d; border-radius: 4px; background: #fff; color: #17324d; cursor: pointer; }
    .image-dialog-close:hover, .image-dialog-close:focus { background: #edf4f2; }
    @media (max-width: 1000px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; padding: 2rem; }
    }
    @media (max-width: 700px) {
      .gallery { grid-template-columns: 1fr; gap: 1.25rem; padding: 1.25rem; }
    }
  </style>

  <dialog class="image-dialog" id="image-dialog" aria-labelledby="image-dialog-title">
    <div class="image-dialog-viewer">
      <img id="image-dialog-image" class="image-dialog-image" alt="">
      <video id="image-dialog-video" class="image-dialog-video" controls></video>
      <div class="image-dialog-nav" aria-label="Image navigation">
        <button class="image-dialog-arrow" id="previous-image" type="button" aria-label="Previous image">&#8249;</button>
        <button class="image-dialog-arrow" id="next-image" type="button" aria-label="Next image">&#8250;</button>
      </div>
    </div>
    <div class="image-dialog-content">
      <h2 id="image-dialog-title"></h2>
      <p id="image-dialog-caption"></p>
      <button class="image-dialog-close" type="button">Close image</button>
    </div>
  </dialog>

  <script>
    const imageDialog = document.getElementById('image-dialog');
    const dialogImage = document.getElementById('image-dialog-image');
    const dialogVideo = document.getElementById('image-dialog-video');
    const dialogTitle = document.getElementById('image-dialog-title');
    const dialogCaption = document.getElementById('image-dialog-caption');
    const closeButton = imageDialog.querySelector('.image-dialog-close');
    const previousButton = document.getElementById('previous-image');
    const nextButton = document.getElementById('next-image');
    const galleryMedia = [...document.querySelectorAll('.gallery img, .gallery video')];
    let currentImageIndex = 0;

    function updateImageDialog() {
      const media = galleryMedia[currentImageIndex];
      const caption = media.nextElementSibling.textContent;
      const isVideo = media.tagName === 'VIDEO';
      dialogImage.hidden = isVideo;
      dialogVideo.hidden = !isVideo;
      dialogVideo.pause();
      if (isVideo) {
        dialogImage.removeAttribute('src');
        dialogVideo.muted = media.muted;
        dialogVideo.controls = !media.muted;
        dialogVideo.src = media.src;
        dialogVideo.load();
        dialogVideo.play();
      } else {
        dialogVideo.removeAttribute('src');
        dialogVideo.load();
        dialogImage.src = media.src;
        dialogImage.alt = media.alt;
      }
      dialogTitle.textContent = media.alt || media.getAttribute('aria-label');
      dialogCaption.textContent = caption;
    }

    function openImageDialog(media) {
      currentImageIndex = galleryMedia.indexOf(media);
      updateImageDialog();
      imageDialog.showModal();
      closeButton.focus();
    }

    function showAdjacentImage(direction) {
      currentImageIndex = (currentImageIndex + direction + galleryMedia.length) % galleryMedia.length;
      updateImageDialog();
    }

    galleryMedia.forEach((media) => {
      media.addEventListener('click', () => openImageDialog(media));
      media.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openImageDialog(media);
        }
      });
    });

    previousButton.addEventListener('click', () => showAdjacentImage(-1));
    nextButton.addEventListener('click', () => showAdjacentImage(1));
    closeButton.addEventListener('click', () => {
      dialogVideo.pause();
      dialogVideo.removeAttribute('src');
      dialogVideo.load();
      imageDialog.close();
    });
    imageDialog.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') showAdjacentImage(-1);
      if (event.key === 'ArrowRight') showAdjacentImage(1);
    });
    imageDialog.addEventListener('click', (event) => {
      if (event.target === imageDialog) imageDialog.close();
    });
  </script>
