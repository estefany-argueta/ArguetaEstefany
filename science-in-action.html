<!doctype html>
<html lang="en">

  <style>

  <nav><a href="index.html">Back to home</a></nav>

  <main class="gallery">

    <figure><img src="images/projects/male_BSB.jpg" alt="Male black sea bass"><figcaption>Documenting biodiversity</figcaption></figure>
    <figure><img src="images/projects/turtle01.jpg" alt="Sea turtle"><figcaption>Conservation research</figcaption></figure>
